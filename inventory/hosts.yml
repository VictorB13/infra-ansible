---
# Inventory is filled by the build pipeline (EC2 public IP from Terraform).
# For local runs, set ansible_host to the instance IP.
all:
  children:
    k3s:
      hosts:
        k3s-node:
          ansible_host: "{{ lookup('env', 'K3S_NODE_IP') | default('REPLACE_WITH_EC2_IP', true) }}"
          ansible_user: ubuntu
          ansible_ssh_private_key_file: "{{ lookup('env', 'SSH_PRIVATE_KEY_PATH') | default('~/.ssh/id_rsa', true) }}"
