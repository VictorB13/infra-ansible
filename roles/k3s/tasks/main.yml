---
- name: Build k3s server install args
  ansible.builtin.set_fact:
    k3s_install_exec: >-
      {{
        (k3s_server_args + (['--tls-san=' ~ k3s_tls_san] if k3s_tls_san | length > 0 else []))
        | join(' ')
      }}

- name: Check if k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install k3s server
  ansible.builtin.shell: |
    curl -sfL {{ k3s_install_url }} | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -s - server {{ k3s_install_exec }}
  args:
    executable: /bin/bash
  when: not k3s_binary.stat.exists

- name: Ensure k3s service is enabled and started
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started
    daemon_reload: true

- name: Wait until k3s API is responding
  ansible.builtin.command: k3s kubectl get --raw=/readyz
  register: k3s_readyz
  retries: "{{ k3s_wait_retries }}"
  delay: "{{ k3s_wait_delay }}"
  until: k3s_readyz.rc == 0
  changed_when: false
  when: k3s_wait_for_node | bool

- name: Wait until node is Ready
  ansible.builtin.command: k3s kubectl get nodes --no-headers
  register: k3s_nodes
  retries: "{{ k3s_wait_retries }}"
  delay: "{{ k3s_wait_delay }}"
  until: k3s_nodes.stdout is search('Ready')
  changed_when: false
  when: k3s_wait_for_node | bool

- name: Ensure kubeconfig directory exists for ubuntu
  ansible.builtin.file:
    path: "{{ k3s_kubeconfig_dest | dirname }}"
    state: directory
    owner: "{{ k3s_kubeconfig_owner }}"
    group: "{{ k3s_kubeconfig_group }}"
    mode: "0755"

- name: Copy kubeconfig for ubuntu user
  ansible.builtin.copy:
    src: "{{ k3s_kubeconfig_src }}"
    dest: "{{ k3s_kubeconfig_dest }}"
    remote_src: true
    owner: "{{ k3s_kubeconfig_owner }}"
    group: "{{ k3s_kubeconfig_group }}"
    mode: "0600"

- name: Show cluster node status
  ansible.builtin.command: k3s kubectl get nodes -o wide
  register: k3s_node_status
  changed_when: false

- name: Cluster node status
  ansible.builtin.debug:
    var: k3s_node_status.stdout_lines
