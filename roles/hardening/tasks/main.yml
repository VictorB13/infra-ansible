---
# Host firewall (iptables)
# All iptables calls use -w (wait for xtables lock) because k3s holds the
# lock during CNI setup — without -w Ansible races and fails.
# After firewall changes we reset the Ansible SSH connection.

- name: Ensure UFW is disabled (we use iptables only)
  ansible.builtin.systemd:
    name: ufw
    state: stopped
    enabled: false
  failed_when: false

- name: Brief pause so k3s can finish initial iptables programming
  ansible.builtin.pause:
    seconds: 8

# Insert at the top in reverse priority so final order is:
#   loopback → established → SSH/HTTP/HTTPS → ICMP → (policy DROP)

- name: Allow ICMP echo-request (IPv4)
  ansible.builtin.shell: |
    set -e
    iptables -w 60 -C INPUT -p icmp --icmp-type echo-request -j ACCEPT -m comment --comment hardening-icmp 2>/dev/null \
      || iptables -w 60 -I INPUT 1 -p icmp --icmp-type echo-request -j ACCEPT -m comment --comment hardening-icmp
  args:
    executable: /bin/bash
  changed_when: true
  when: hardening_allow_icmp | bool

- name: Allow TCP ports on INPUT (IPv4)
  ansible.builtin.shell: |
    set -e
    iptables -w 60 -C INPUT -p tcp --dport {{ item }} -j ACCEPT -m comment --comment hardening-tcp-{{ item }} 2>/dev/null \
      || iptables -w 60 -I INPUT 1 -p tcp --dport {{ item }} -j ACCEPT -m comment --comment hardening-tcp-{{ item }}
  args:
    executable: /bin/bash
  loop: "{{ hardening_allowed_tcp_ports | reverse | list }}"
  changed_when: true

- name: Allow established and related connections (IPv4)
  ansible.builtin.shell: |
    set -e
    iptables -w 60 -C INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT -m comment --comment hardening-established 2>/dev/null \
      || iptables -w 60 -I INPUT 1 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT -m comment --comment hardening-established
  args:
    executable: /bin/bash
  changed_when: true

- name: Allow loopback traffic (IPv4)
  ansible.builtin.shell: |
    set -e
    iptables -w 60 -C INPUT -i lo -j ACCEPT -m comment --comment hardening-loopback 2>/dev/null \
      || iptables -w 60 -I INPUT 1 -i lo -j ACCEPT -m comment --comment hardening-loopback
  args:
    executable: /bin/bash
  changed_when: true

- name: Set INPUT policy to DROP (IPv4)
  ansible.builtin.command: iptables -w 60 -P INPUT DROP
  changed_when: true

- name: Set FORWARD policy to ACCEPT (required for k3s/CNI)
  ansible.builtin.command: iptables -w 60 -P FORWARD ACCEPT
  changed_when: true

- name: Set OUTPUT policy to ACCEPT (IPv4)
  ansible.builtin.command: iptables -w 60 -P OUTPUT ACCEPT
  changed_when: true

# --- IPv6: deny inbound by default (avoid bypassing IPv4 firewall) ---

- name: Allow established and related connections (IPv6)
  ansible.builtin.shell: |
    set -e
    ip6tables -w 60 -C INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT -m comment --comment hardening-established-v6 2>/dev/null \
      || ip6tables -w 60 -I INPUT 1 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT -m comment --comment hardening-established-v6
  args:
    executable: /bin/bash
  changed_when: true

- name: Allow loopback traffic (IPv6)
  ansible.builtin.shell: |
    set -e
    ip6tables -w 60 -C INPUT -i lo -j ACCEPT -m comment --comment hardening-loopback-v6 2>/dev/null \
      || ip6tables -w 60 -I INPUT 1 -i lo -j ACCEPT -m comment --comment hardening-loopback-v6
  args:
    executable: /bin/bash
  changed_when: true

- name: Set INPUT policy to DROP (IPv6)
  ansible.builtin.command: ip6tables -w 60 -P INPUT DROP
  changed_when: true

- name: Set FORWARD policy to ACCEPT (IPv6)
  ansible.builtin.command: ip6tables -w 60 -P FORWARD ACCEPT
  changed_when: true

- name: Set OUTPUT policy to ACCEPT (IPv6)
  ansible.builtin.command: ip6tables -w 60 -P OUTPUT ACCEPT
  changed_when: true

- name: Persist iptables rules
  ansible.builtin.command: netfilter-persistent save
  when: hardening_persist | bool
  changed_when: true

- name: Reset SSH connection after firewall change
  ansible.builtin.meta: reset_connection

- name: Wait for SSH after firewall change
  ansible.builtin.wait_for_connection:
    connect_timeout: 10
    delay: 2
    timeout: 60

- name: Configure fail2ban
  ansible.builtin.import_tasks: fail2ban.yml
  when: hardening_fail2ban | bool
